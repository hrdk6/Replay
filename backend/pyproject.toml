[project]
name = "replay-api"
version = "0.1.0"
description = "Replay API server and workers."
requires-python = ">=3.12,<3.13"
dependencies = [
  "replay-stats",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "httpx>=0.27",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.13",
  "boto3>=1.35",
  "cryptography>=43",
  "regex>=2024.7.24",
  "opentelemetry-proto>=1.27",
  "prometheus-client>=0.20",
  "anthropic>=0.60",
  "openai>=1.60",
]

[project.scripts]
replay-api = "replay_api.cli:serve"
replay-worker = "replay_api.worker.main:run"
replay-admin = "replay_api.cli:admin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_api"]
