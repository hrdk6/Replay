[project]
name = "replay-stats"
version = "0.1.0"
description = "Paired-comparison statistics for Replay experiments: CIs, tests, agreement, verdicts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_stats"]
