[project]
name = "replay-sdk"
version = "0.1.0"
description = "Capture LLM and agent traces for Replay. Zero dependencies; never blocks or crashes your app."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay_sdk"]
